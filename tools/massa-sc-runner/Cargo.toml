[package]
name = "massa-sc-runner"
description = "Run Massa smart-contract wasm modules locally in the real Massa runtime (massa-sc-runtime) against an in-memory ledger"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/massalabs/massa-rust-sc-sdk"
publish = false

# Standalone workspace: pulls wasmer, which the SDK workspace must not depend on.
[workspace]

# The C-Layer flavour (adds the `hash_mimc` host function) lives in `clayer/`:
# its runtime is a private repository, so it is a separate, non-CI manifest
# that compiles these same sources with the `clayer` cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("clayer"))'] }

[dependencies]
# Pin the runtime revision used by the node you target.
massa-sc-runtime = { git = "https://github.com/massalabs/massa-sc-runtime", rev = "b40ec3899ca7eec92ee206d50c701157f7f429b4", features = ["testing"] }
# Only here because the runtime's `Interface` trait still names the (disabled) wasmv1 types.
massa-proto-rs = { git = "https://github.com/massalabs/massa-proto-rs.git", rev = "0bcc52f40d2d7d596eeaf8f8713364bd7c15594b" }
anyhow = "1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
ethnum = "1.5"
wasmparser = "0.229"

[dev-dependencies]
# The interoperability suite (tests/interop.rs) speaks to the fixtures with the SDK's Args.
massa-sc-sdk = { path = "../../massa-sc-sdk", default-features = false }

[profile.release]
opt-level = 2
