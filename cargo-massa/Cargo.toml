[package]
name = "cargo-massa"
description = "cargo subcommand to build, check and scaffold Massa smart contracts written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "cargo-massa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.19"
wasmparser = "0.229"
wasm-encoder = "0.229"
