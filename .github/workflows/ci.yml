name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p massa-sc-sdk -p massa-sc-standards --target wasm32v1-none --release
      - run: cargo build -p massa-sc-sdk --target wasm32v1-none --release --no-default-features --features macros,allocator,panic-handler

  contract:
    name: scaffold, build and run a contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/massa-sc-runner
      - run: cargo install --path cargo-massa
      - run: cargo install --path tools/massa-sc-runner
      - name: counter template
        run: |
          cargo massa new ci-counter --sdk '{ path = "../massa-sc-sdk" }'
          cd ci-counter && cargo test && cargo massa build --no-wasm-opt
          massa-sc-runner build/ci_counter.wasm constructor --args u64:10 --deploy \; increment --args u64:5 \; get --quiet
      - name: token template
        run: |
          cargo massa new ci-token --template token --sdk '{ path = "../massa-sc-sdk" }' --standards '{ path = "../massa-sc-standards" }'
          cd ci-token && cargo test && cargo massa build --no-wasm-opt
          massa-sc-runner build/ci_token.wasm constructor --args "s:T,s:T,u8:9,u256:1000" --deploy \; balanceOf --args "addr:AU1dQZLc618t4CNYWYiDnFnq585kifefr1EAcMi5jddJZGQJXJXL" --quiet

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p massa-sc-sdk -p massa-sc-standards --target wasm32v1-none --release
      - run: cargo test -p massa-sc-sdk -p massa-sc-standards
