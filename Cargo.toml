[workspace]
resolver = "2"
members = [
    "massa-sc-sdk",
    "massa-sc-sdk-macros",
    "massa-sc-standards",
    "cargo-massa",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/massalabs/massa-rust-sc-sdk"
authors = ["Massa Labs <info@massa.net>"]

[workspace.dependencies]
massa-sc-sdk = { path = "massa-sc-sdk", version = "0.2.0", default-features = false }
massa-sc-sdk-macros = { path = "massa-sc-sdk-macros", version = "0.2.0" }
massa-sc-standards = { path = "massa-sc-standards", version = "0.2.0", default-features = false }

# Release profile tuned for small, gas-efficient contracts. Contract crates
# that live outside this workspace should copy this block (see README).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
# Keep integer overflow checks in release builds: a silently wrapping
# arithmetic bug is far more expensive than the few extra instructions.
overflow-checks = true
